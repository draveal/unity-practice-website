<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Unity Practice</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0A1A2F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0A1A2F;color:#F5F7FA;
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    text-align:center;padding:24px}
  .wrap{max-width:420px}
  .code{font-size:64px;font-weight:400;color:#F2C94C;line-height:1}
  h1{font-size:22px;font-weight:400;margin:16px 0 8px}
  p{color:#8ca0b8;line-height:1.6;font-size:15px;margin-bottom:6px}
  .home{display:inline-block;margin-top:24px;padding:12px 28px;border-radius:24px;
    background:#E0A93F;color:#0A1A2F;text-decoration:none;font-weight:500}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Seite nicht gefunden</h1>
    <p>Diese Seite existiert nicht oder wurde verschoben.</p>
    <p>Страница не найдена · Page not found</p>
    <a class="home" href="/">Zur Startseite · На главную · Home</a>
  </div>
</body>
</html>
